- file:
    path:  "/etc/systemd/system/{{ timer }}.timer.d"
    state: directory
    mode:  "755"
    owner: "root"
    group: "root"

- template:
    src:   "systemd-timer-override.conf.j2"
    dest:  "/etc/systemd/system/{{ timer }}.timer.d/override.conf"
    mode:  "644"
    owner: "root"
    group: "root"
  register: timer_changed

# Unmask the related service, which can be masked in the Vagrant box.
# Idempotent on real ISO installs.
- systemd:
    service: "{{ timer }}.service"
    masked: no
    daemon_reload: yes
  when: timer_changed.changed

- systemd:
    service: "{{ timer }}.timer"
    state: restarted
    enabled: yes
  when: timer_changed.changed
